<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="256" rx="128" fill="url(#glowGrad)"/>
  <!-- Decorative Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
  </g>
  <!-- Modern Monogram M & D with growth curve -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star node -->
    <circle cx="396" cy="116" r="32" fill="#ffffff" stroke="none"/>
    <circle cx="396" cy="116" r="48" fill="#ffffff" fill-opacity="0.2" stroke="none"/>
    <!-- M Vector -->
    <path d="M100 370V190L186 300L272 190V370" stroke-width="38"/>
    <!-- D Curve Vector -->
    <path d="M272 190H344C390 190 428 228 428 274C428 320 390 358 344 358H272" stroke-width="38" stroke-opacity="0.9"/>
    <!-- Trend ray -->
    <path d="M280 148L396 116" stroke-width="22" stroke-dasharray="24 16" stroke-opacity="0.8"/>
  </g>
</svg>
