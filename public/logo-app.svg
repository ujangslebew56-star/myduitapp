<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="65%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle rounded badge with transparent background outside -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="64" y="64" width="896" height="448" rx="224" fill="url(#topHighlight)"/>

  <!-- Subtle architectural financial grid pattern -->
  <g opacity="0.10" stroke="#ffffff" stroke-width="2.5">
    <line x1="128" y1="256" x2="896" y2="256"/>
    <line x1="128" y1="512" x2="896" y2="512"/>
    <line x1="128" y1="768" x2="896" y2="768"/>
    <line x1="256" y1="128" x2="256" y2="896"/>
    <line x1="512" y1="128" x2="512" y2="896"/>
    <line x1="768" y1="128" x2="768" y2="896"/>
  </g>

  <!-- Modern White Monogram M & D with growth curve -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star node -->
    <circle cx="780" cy="240" r="60" fill="#ffffff" stroke="none"/>
    <circle cx="780" cy="240" r="90" fill="#ffffff" fill-opacity="0.22" stroke="none"/>

    <!-- M Vector -->
    <path d="M200 740V380L370 600L540 380V740" stroke-width="72"/>

    <!-- D Curve Vector -->
    <path d="M540 380H680C770 380 844 454 844 544C844 634 770 708 680 708H540" stroke-width="72" stroke-opacity="0.95"/>

    <!-- Trend ray -->
    <path d="M560 300L780 240" stroke-width="40" stroke-dasharray="46 32" stroke-opacity="0.85"/>
  </g>
</svg>
