name: Deploy MY DUIT to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          
          # Inject package.json, vercel.json, and mirror dist directory
          # so Vercel can seamlessly deploy the gh-pages branch without any missing file errors
          node -e "
            const fs = require('fs');
            fs.writeFileSync('dist/package.json', JSON.stringify({
              name: 'my-duit-dist',
              version: '1.0.0',
              private: true,
              scripts: {
                build: 'mkdir -p dist && cp -r index.html 404.html assets favicon* icon* manifest* dist/ 2>/dev/null || true'
              }
            }, null, 2));

            fs.writeFileSync('dist/vercel.json', JSON.stringify({
              cleanUrls: true,
              rewrites: [{ source: '/(.*)', destination: '/index.html' }]
            }, null, 2));
          "
          mkdir -p dist/dist
          cp -r dist/index.html dist/404.html dist/assets dist/dist/ 2>/dev/null || true

      # 1. Deploy otomatis ke branch gh-pages (Metode paling stabil & aman tanpa konfigurasi rumit)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      # 2. Deploy via GitHub Actions Pages (Jika repo di-set ke Source: GitHub Actions)
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
